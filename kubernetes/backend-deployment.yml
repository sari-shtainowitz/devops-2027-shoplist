# backend-deployment.yml - the image we built, with passwords from the Secret
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shoplist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend                     # the backend label
  template:
    metadata:
      labels:
        app: backend                   # exactly the same label
    spec:
      containers:
        - name: backend
          image: shoplist-backend:local                # the image we built in step 1, including the tag
          imagePullPolicy: never     # do not download: the image is already on this computer
          env:
            - name: DB_HOST
              value: postgres           # name of the postgres Service. Not a secret, so written directly
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

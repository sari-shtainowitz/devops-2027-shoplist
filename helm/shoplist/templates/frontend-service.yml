apiVersion: v1
kind: Service
metadata:
  name:  frontend          # this name is the address. nginx.conf looks for it
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: frontend          # must match the label in stats-deployment.yml
  ports:
    - port: 80
      targetPort: 80
      nodePort: {{ .Values.frontend.nodePort }}
